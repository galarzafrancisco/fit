apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: fit
  namespace: fit
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: public
    namespace: gateways
  listeners:
    - name: https
      hostname: fit.american-broomstick.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: fit-tls
      allowedRoutes:
        namespaces:
          from: Same
