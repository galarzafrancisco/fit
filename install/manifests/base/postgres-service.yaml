apiVersion: v1
kind: Service
metadata:
  name: fit-postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 15435
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: fit-postgres-host
  labels:
    kubernetes.io/service-name: fit-postgres
addressType: IPv4
ports:
  - name: postgres
    protocol: TCP
    port: 15435
endpoints:
  - addresses:
      - PLACEHOLDER_SPARK_IP
    conditions:
      ready: true
